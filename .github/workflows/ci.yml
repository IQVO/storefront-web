name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:

  # Agent-guide sensor (harness-template v3): skills load, references resolve, context budget.
  # BLOCKING: guides are clean.
  guide-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/harness/guide_lint.py
      - run: python3 scripts/harness/repo_lint.py
      - run: python3 scripts/harness/test_hook.py
      - run: python3 scripts/harness/test_red_issue.py
      - run: python3 scripts/harness/test_repo_lint.py

  # Required job: vitest (with coverage thresholds) + tsc + eslint.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  # File-length budget: at most 300 lines of code per production TypeScript
  # file (oxlint eslint/max-lines; comments and blank lines are not counted;
  # config in .oxlintrc.file-length.json, separate from the main lint config).
  # Pull requests into develop: BLOCKING for every .ts/.tsx file the PR adds or
  # touches, so an oversized legacy file is split the next time it changes.
  # Release PRs, push and schedule: informational report of the backlog.
  file-length:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      # A PR whose only .ts changes are ignored by .oxlintrc.file-length.json (docs/**, *.d.ts, tests) must
      # pass: plain oxlint exits 1 on "No files found to lint". The self-test proves both directions every run.
      - name: file-length gate self-test (ignored-only diff passes, oversized file fails)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          set -euo pipefail
          lint() { xargs -0 npx --yes oxlint@1.90.0 -c .oxlintrc.file-length.json --no-error-on-unmatched-pattern; }
          mkdir -p zz-fl-probe
          echo 'export declare const probe: number;' > zz-fl-probe/ignored.d.ts
          { echo 'export function f(): number {'; echo '  let x = 0;'
            for i in $(seq 320); do echo "  x += $i;"; done
            echo '  return x;'; echo '}'; } > zz-fl-probe/oversized.ts
          printf 'zz-fl-probe/ignored.d.ts\0' | lint
          if printf 'zz-fl-probe/oversized.ts\0' | lint > /dev/null; then
            echo "::error::file-length self-test: a 320-line file passed the gate"; exit 1
          fi
          rm -rf zz-fl-probe
          echo "self-test: ignored-only diff passes, oversized file fails"
      - name: file length of the TypeScript files this PR adds or touches (blocking)
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=AMR -z origin/develop...HEAD -- '*.ts' '*.tsx' > "$RUNNER_TEMP/changed"
          if [ ! -s "$RUNNER_TEMP/changed" ]; then echo "No TypeScript file changed."; exit 0; fi
          xargs -0 npx --yes oxlint@1.90.0 -c .oxlintrc.file-length.json --no-error-on-unmatched-pattern < "$RUNNER_TEMP/changed"
      - name: file length backlog (informational)
        if: github.event_name != 'pull_request' || github.base_ref != 'develop'
        run: npx --yes oxlint@1.90.0 -c .oxlintrc.file-length.json . || true

  # Required sensor: the client bundle reaches no backend except /api/storefront.
  no-network-url-in-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle

  # Required sensor: LCP / TBT (INP proxy) / CLS budgets of plan section 8, mobile and desktop,
  # on home, search, product page and cart, served with the stub BFF.
  lighthouse-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LHCI_FORM_FACTOR: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  # Playwright journeys against the stub BFF. Against a real BFF they run locally:
  #   E2E_BASE_URL=http://localhost:3000 npm run e2e
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t storefront-web:ci .

  # Helm packaging: ct lint against the chart's ci/ values files plus helm lint
  # with each of them (both carry a dummy config.bffUrl; nothing is dialled).
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Run chart-testing (lint)
        run: ct lint --charts charts/storefront-web --validate-maintainers=false --check-version-increment=false
      - name: helm lint with every ci values file
        run: |
          helm lint charts/storefront-web -f charts/storefront-web/ci/default-values.yaml
          helm lint charts/storefront-web -f charts/storefront-web/ci/all-components-values.yaml

  # Chart behaviour tests (render_test.sh, test_service_selectors.py) on every
  # push and PR: the envFrom ConfigMap mount, the Service selecting exactly one
  # Deployment, the render refusals. PyYAML is hash-pinned; a test that prints
  # SKIP fails the job (a selector test must never pass vacuously).
  chart-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install PyYAML (hash-pinned)
        run: python3 -m pip install --require-hashes -r .github/requirements/chart-tests.txt
      - name: Chart tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(charts/storefront-web/tests/*.sh charts/storefront-web/tests/test_*.py)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::no chart tests in charts/storefront-web/tests"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            status=0
            case "$t" in
              *.sh) out=$(bash "$t" 2>&1) || status=$? ;;
              *) out=$(python3 "$t" 2>&1) || status=$? ;;
            esac
            echo "$out"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$t failed"
              exit "$status"
            fi
            if grep -q '^SKIP' <<<"$out"; then
              echo "::error::$t printed SKIP: a chart test must not pass vacuously (is PyYAML or helm missing?)"
              exit 1
            fi
          done
