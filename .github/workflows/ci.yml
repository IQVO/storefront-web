name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:

  # Agent-guide sensor (harness-template v3): skills load, references resolve, context budget.
  # BLOCKING: guides are clean.
  guide-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/harness/guide_lint.py
      - run: python3 scripts/harness/repo_lint.py
      - run: python3 scripts/harness/test_hook.py
      - run: python3 scripts/harness/test_red_issue.py
      - run: python3 scripts/harness/test_repo_lint.py

  # Required job: vitest (with coverage thresholds) + tsc + eslint.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  # Required sensor: the client bundle reaches no backend except /api/storefront.
  no-network-url-in-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle

  # Required sensor: LCP / TBT (INP proxy) / CLS budgets of plan section 8, mobile and desktop,
  # on home, search, product page and cart, served with the stub BFF.
  lighthouse-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LHCI_FORM_FACTOR: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  # Playwright journeys against the stub BFF. Against a real BFF they run locally:
  #   E2E_BASE_URL=http://localhost:3000 npm run e2e
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t storefront-web:ci .
